<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPINE — Monthly Transmission</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    >

    <style>
      :root {
        --bg: #020913;
        --text: #eef9ff;
        --muted: #8faec2;
        --blue-100: #eef9ff;
        --blue-200: #d9f3ff;
        --blue-300: #bae7ff;
        --blue-400: #90d8ff;
        --border: #173548;
        --glow: #90d8ff;
        --max: 720px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Sora", sans-serif;
        background:
          radial-gradient(
            circle at top,
            rgba(144, 216, 255, .12),
            transparent 40%
          ),
          linear-gradient(to bottom, #03101c, var(--bg));
        color: var(--text);
        min-height: 100vh;
      }

      .container {
        width: min(100%, var(--max));
        margin: auto;
        padding: 40px 20px 80px;
      }

      header {
        margin-bottom: 70px;
      }

      .logo {
        font-size: clamp(3.5rem, 11vw, 6.5rem);
        font-weight: 700;
        letter-spacing: -0.08em;
        color: var(--blue-100);
      }

      .tagline {
        margin-top: 14px;
        font-size: .85rem;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--blue-300);
      }

      .month {
        margin-top: 12px;
        font-size: .8rem;
        color: var(--muted);
        letter-spacing: .15em;
        text-transform: uppercase;
      }

      .book {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 28px;
        align-items: start;
        margin-bottom: 60px;
      }

      .cover-wrap {
        position: relative;
        width: 120px;
        margin-bottom: 0;
      }

      .cover-wrap::before {
        content: "";
        position: absolute;
        inset: 12%;
        background: var(--glow);
        opacity: .15;
        filter: blur(35px);
      }

      .cover {
        width: 120px;
        height: auto;
        display: block;
        border: 1px solid var(--border);
        position: relative;
        z-index: 2;
        background: #000;
      }

      .title {
        font-size: 1.4rem;
        font-weight: 600;
        line-height: 1.2;
      }

      .author {
        margin-top: 10px;
        color: var(--muted);
        font-size: .95rem;
      }

      .buy {
        display: inline-block;
        margin-top: 22px;
        padding: 12px 16px;
        border: 1px solid var(--blue-400);
        color: var(--blue-200);
        text-decoration: none;
        font-size: .8rem;
        letter-spacing: .12em;
        text-transform: uppercase;
        transition: .2s ease;
      }

      .buy:hover {
        background: var(--blue-400);
        color: var(--bg);
      }

      @media (max-width: 480px) {
        .container {
          padding: 30px 18px 70px;
        }

        header {
          margin-bottom: 55px;
        }

        .book {
          grid-template-columns: 90px 1fr;
          gap: 20px;
          margin-bottom: 50px;
        }

        .cover-wrap {
          width: 90px;
        }

        .cover {
          width: 90px;
          height: auto;
        }

        .title {
          font-size: 1.05rem;
        }

        .author {
          font-size: .82rem;
        }

        .buy {
          margin-top: 18px;
          padding: 10px 12px;
          font-size: .68rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">

      <header>
        <h1 class="logo">SPINE</h1>
        <div class="tagline">Two Books. Every Month.</div>
        <div class="month">September 2026</div>
      </header>

      <section class="book">
        <div class="cover-wrap">
          <img
            class="cover"
            src="https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1448831709i/28010711.jpg"
            alt="An Introduction to Cybernetics by W. Ross Ashby"
          >
        </div>

        <div>
          <h2 class="title">An Introduction to Cybernetics</h2>

          <div class="author">
            W. Ross Ashby
          </div>

          <a
            class="buy"
            href="https://openlibrary.org/books/OL6202924M/An_introduction_to_cybernetics"
            target="_blank"
            rel="noopener"
          >
            Read Online →
          </a>
        </div>
      </section>

      <section class="book">
        <div class="cover-wrap">
          <img
            class="cover"
            src="https://www.gutenberg.org/cache/epub/71292/pg71292.cover.medium.jpg"
            alt="The Calculating Engine by Charles Babbage"
          >
        </div>

        <div>
          <h2 class="title">The Calculating Engine</h2>

          <div class="author">
            Charles Babbage
          </div>

          <a
            class="buy"
            href="https://www.gutenberg.org/ebooks/71292"
            target="_blank"
            rel="noopener"
          >
            Read Online →
          </a>
        </div>
      </section>

    </div>
  </body>
</html>
